# Render Blueprint: static site for Break-a-Fast Bistro and Bar
services:
  - type: web
    name: break-a-fast
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /js/*
        name: Cache-Control
        value: no-cache
      - path: /css/*
        name: Cache-Control
        value: no-cache
      - path: /*.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /menu
        destination: /menu.html
      - type: rewrite
        source: /events
        destination: /events.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /checkout
        destination: /checkout.html

  # Order server: re-prices orders and seals them so WhatsApp messages can be verified.
  - type: web
    name: break-a-fast-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: "true"
    startCommand: node api/server.js
    healthCheckPath: /health
    envVars:
      - key: SIGNING_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://break-a-fast.onrender.com
