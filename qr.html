<style>
  .qr-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .qr-card { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .qr-card img { width: 100%; display: block; }
  .qr-card figcaption { padding: 8px 12px; font-weight: 700; text-align: center; }
  @media print {
    .site-header, .site-footer, .wa-float, .page-head, .no-print, .qr-card figcaption { display: none !important; }
    body { background: #fff; }
    .qr-grid { grid-template-columns: repeat(2, 1fr); gap: 10mm; }
    .qr-card { break-inside: avoid; border: 0; }
